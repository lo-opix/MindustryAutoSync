## Settings
mas-settings = Synchronisation
setting.mas-script-url.name = URL du script Apps Script
setting.mas-folder.name = Dossier Google Drive (lien ou ID)
setting.mas-secret.name = Mot de passe (optionnel)
setting.mas-enable-export.name = Envoyer la sauvegarde sur Google Drive
setting.mas-enable-import.name = Télécharger la sauvegarde si modifiée
setting.mas-enable-import.description = Téléchargement uniquement au démarrage du jeu
mas-test-connection = Tester la connexion

## Status messages
mas-not-configured = Renseignez d'abord l'URL du script et le dossier Google Drive.
mas-connection-ok = Connexion réussie, une sauvegarde a été trouvée sur Google Drive.
mas-connection-ok-empty = Connexion réussie. Il n'y a pas encore de sauvegarde sur Google Drive, elle sera envoyée à la prochaine sauvegarde.
mas-offline = [scarlet]Pas de connexion internet :[] Google Drive est injoignable.
mas-offline-import = Votre sauvegarde n'a pas été synchronisée, la sauvegarde locale est utilisée.\nElle sera envoyée quand la connexion reviendra.
mas-offline-export = Votre sauvegarde n'a pas pu être envoyée sur Google Drive. Nouvel essai à la prochaine sauvegarde.
mas-drive-error = [scarlet]Erreur Google Drive :[]
mas-script-not-public = Le script Apps Script a répondu par une page de connexion. Vérifiez qu'il est déployé avec l'accès « Tout le monde ».
mas-invalid-import = Une erreur a été rencontrée lors de l'importation de la sauvegarde depuis Google Drive.
mas-successful-import = La sauvegarde a bien été synchronisée depuis Google Drive
