## Settings
mas-settings = Automatic Sync
setting.mas-script-url.name = Apps Script URL
setting.mas-folder.name = Google Drive folder (link or ID)
setting.mas-secret.name = Password (optional)
setting.mas-enable-export.name = Upload save to Google Drive
setting.mas-enable-import.name = Download save when changed
setting.mas-enable-import.description = Only downloads the save on game start
mas-test-connection = Test connection

## Status messages
mas-not-configured = Set the Apps Script URL and the Google Drive folder first.
mas-connection-ok = Connection successful, a save was found on Google Drive.
mas-connection-ok-empty = Connection successful. There is no save on Google Drive yet, it will be uploaded at the next save.
mas-offline = [scarlet]No internet connection:[] Google Drive cannot be reached.
mas-offline-import = Your save was not synced, the local save is used.\nIt will be uploaded once the connection is back.
mas-offline-export = Your save could not be uploaded to Google Drive. It will be retried at the next save.
mas-drive-error = [scarlet]Google Drive error:[]
mas-script-not-public = The Apps Script answered with a login page. Check that it is deployed with access "Anyone".
mas-invalid-import = An error occurred when importing your save from Google Drive.
mas-successful-import = Game save has been synced from Google Drive
